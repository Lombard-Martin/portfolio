<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Lombard — Portfolio BTS Bioqualité</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            
            /* Codes Couleurs Globaux */
            --color-projet: #3b82f6;       /* Bleu */
            --color-norme: #10b981;        /* Émeraude */
            --color-etudes: #f59e0b;       /* Ambre/Orange */

            /* Couleurs Spécifiques par Carte */
            --card-huile-border: #15803d;  /* Vert foncé */
            --card-huile-badge: #14532d;
            --card-saur-border: #2563eb;   /* Bleu Eau */
            --card-saur-badge: #1e3a8a;
            --card-pates-border: #eab308;  /* Jaune */
            --card-pates-badge: #854d0e;
            --card-guyane-border: #ef4444; /* Rouge */
            --card-guyane-badge: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--color-norme);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Hero */
        .hero {
            padding: 60px 0 40px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--color-norme);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .location {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Filtres */
        .filter-container {
            display: flex;
            gap: 10px;
            margin: 30px 0 10px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            color: #fff;
        }

        .filter-btn[data-filter="all"].active {
            background-color: #334155;
            border-color: #64748b;
        }

        .filter-btn[data-filter="projet"].active {
            background-color: var(--color-projet);
            border-color: var(--color-projet);
        }

        .filter-btn[data-filter="norme"].active {
            background-color: var(--color-norme);
            border-color: var(--color-norme);
        }

        .filter-btn[data-filter="etudes"].active {
            background-color: var(--color-etudes);
            border-color: var(--color-etudes);
        }

        /* Légende */
        .legend {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* TIMELINE VERTICALE */
        .timeline-section {
            position: relative;
            padding: 20px 0;
        }

        .timeline-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--border);
            z-index: 1;
        }

        .timeline-item {
            position: relative;
            padding-left: 60px;
            margin-bottom: 40px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .timeline-item.hidden {
            display: none;
        }

        .timeline-dot {
            position: absolute;
            left: 11px;
            top: 24px;
            width: 20px;
            height: 20px;
